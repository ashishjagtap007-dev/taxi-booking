<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Taxi</title>
    
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        
        h2 {
            text-align: center;
            color: #333;
        }
        
        form {
            max-width: 400px;
            margin: 20px auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
        }
        
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        
        input[type="submit"] {
            background-color: #4caf50;
            color: #fff;
            cursor: pointer;
        }
        
        input[type="submit"]:hover {
            background-color: #45a049;
        }
        
        /* Add media query for better responsiveness */
        @media screen and (max-width: 600px) {
            form {
                max-width: 100%;
            }
        }
        </style>
</head>

<body>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Taxi Booking Management System</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    
    <body>
        <header>
            <h1>Taxi Booking System</h1>
        </header>
    
        <nav>
            <ul>
                <li><a href="index.html">Logout</a></li>
                <li><a href="contact.html">Feedback</a></li>
                <li><a href="admin.html">Admin</a></li> <!-- Added Admin button -->

            </ul>
        </nav>
    <h2>Book a Taxi</h2>
    <form action="process_booking.php" method="post">
        <label for="pickup_location">Pickup Location:</label>
        <input type="text" id="pickup_location" name="pickup_location" required><br>

        <label for="drop_location">Drop Location:</label>
        <input type="text" id="drop_location" name="drop_location" required><br>

        <label for="booking_date">Booking Date:</label>
        <input type="date" id="booking_date" name="booking_date" required><br>

        <label for="booking_time">Booking time:</label>
        <input type="time" id="booking_time" name="booking_time"  required><br>

        <input type="submit" value="Book Now">
        
        <li><a href="index.html">Home</a></li>


    </form>
    <footer>
        <p>&copy; Have a Great Day  !! </p>
    </footer>
</body>
</html>
