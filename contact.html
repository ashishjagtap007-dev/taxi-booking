<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <link rel="stylesheet" href="contact_styles.css" />
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f7f7;
        }

        header {
            background-color: #3a3a8d;
            padding: 20px;
            text-align: center;
            color: #fff;
        }

        h1 {
            margin: 0;
            font-size: 36px;
        }

        main {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .contact-form {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        form label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 16px;
            color: #333;
        }

        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #320505;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }

        input[type="submit"] {
            background-color: #3a3a8d;
            color: #fff;
            border: none;
            padding: 12px 20px;
            font-size: 18px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        input[type="submit"]:hover {
            background-color: #27276a;
        }

        .home-link {
            text-align: center;
            margin-top: 20px;
        }

        .home-link a {
            color: #3a3a8d;
            text-decoration: none;
            font-size: 16px;
        }

        .home-link a:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            padding: 15px;
            background-color: #eee;
            font-size: 14px;
            color: #555;
        }

        @media screen and (max-width: 600px) {
            .contact-form {
                padding: 20px;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Feedback</h1>
    </header>

    <main>
        <div class="contact-form">
            <form action="contact_us.php" method="post" aria-label="Feedback Form">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required />

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required />

                <label for="message">Your Feedback:</label>
                <textarea id="message" name="message" rows="4" required></textarea>

                <input type="submit" value="Submit" />
            </form>
            <div class="home-link">
                <a href="index.html">← Back to Home</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Taxi Booking Management System. All rights reserved.</p>
    </footer>
</body>

</html>
