        max-width: 400px;

        background-color: #e4d6d6;

    }
    
    label {
        display: block;
        margin-bottom: 8px;
        color: #333;
    }
    
    input {
        width: 100%;
        padding: 10px;
        margin-bottom: 16px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    
    input[type="submit"] {
        background-color: #4caf50;
        color: #fff;
        cursor: pointer;
    }
    
    input[type="submit"]:hover {
        background-color: #253792;
    }
    
    /* Add media query for better responsiveness */
    @media screen and (max-width: 600px) {
        form {
            max-width: 100%;
        }
    }
    </style>
</head>
